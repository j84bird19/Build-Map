<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#19181d" />
  <title>Cabin Rebuild Mapper</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.161.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.161.0/examples/jsm/"}}</script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="backBtn" aria-label="Back">←</button>
    <div class="undo-group">
      <button class="icon-btn" id="undoBtn" aria-label="Undo">↶</button>
      <span></span>
      <button class="icon-btn" id="redoBtn" aria-label="Redo">↷</button>
    </div>
    <div id="selectionReadout" class="selection-readout">Cabin Rebuild Mapper</div>
    <button class="save-btn" id="saveBtn">Save</button>
    <button class="process-btn" id="processBtn">3D View</button>
  </header>

  <div class="view-tabs" role="tablist">
    <button class="view-tab active" data-view="design">2D Design</button>
    <button class="view-tab" data-view="assembly">3D Assembly</button>
    <button class="view-tab" data-view="parts">Parts List</button>
  </div>

  <main>
    <section id="designView" class="view active">
      <div class="ruler-corner"></div>
      <canvas id="topRuler" class="top-ruler"></canvas>
      <canvas id="leftRuler" class="left-ruler"></canvas>
      <div id="canvasWrap" class="canvas-wrap">
        <canvas id="designCanvas"></canvas>
      </div>
      <button id="centerBtn" class="center-btn" title="Center design">⌖</button>
    </section>

    <section id="assemblyView" class="view">
      <div id="threeHost"></div>
      <div class="three-tools">
        <button data-mode="translate" class="active">Move</button>
        <button data-mode="rotate">Rotate</button>
        <button data-mode="scale">Scale</button>
        <button id="fit3dBtn">Fit</button>
      </div>
    </section>

    <section id="partsView" class="view">
      <div class="parts-header">
        <input id="partsSearch" placeholder="Search labels, layers, materials…" />
        <button id="exportBtn">Export JSON</button>
        <label class="import-btn">Import JSON<input id="importInput" type="file" accept="application/json" /></label>
      </div>
      <div id="partsTable" class="parts-table"></div>
    </section>
  </main>

  <nav class="bottom-toolbar">
    <button data-panel="parts"><span>▣</span>Parts</button>
    <button data-panel="shapes"><span>⬠</span>Shapes</button>
    <button data-panel="layers"><span>▤</span>Layers</button>
    <button data-panel="measure"><span>↔</span>Measure</button>
    <button data-panel="materials"><span>▧</span>Materials</button>
    <button data-panel="labels"><span>T</span>Labels</button>
    <button data-panel="settings"><span>☷</span>Settings</button>
  </nav>

  <div id="sheetBackdrop" class="sheet-backdrop"></div>
  <aside id="toolSheet" class="tool-sheet" aria-hidden="true">
    <div class="sheet-handle"></div>
    <div class="sheet-title-row"><h2 id="sheetTitle">Shapes</h2><button id="closeSheet">×</button></div>
    <div id="sheetContent"></div>
  </aside>

  <template id="shapePanelTemplate">
    <div class="category-tabs"><button class="active" data-shape-tab="builtins">Construction</button><button data-shape-tab="custom">Custom</button></div>
    <div class="shape-grid" id="builtinShapeGrid">
      <button data-shape="rect"><i class="shape rect"></i><b>Board</b></button>
      <button data-shape="beam"><i class="shape beam"></i><b>Beam</b></button>
      <button data-shape="log"><i class="shape pill"></i><b>Log</b></button>
      <button data-shape="triangle"><i class="shape triangle"></i><b>Triangle</b></button>
      <button data-shape="trapezoid"><i class="shape trapezoid"></i><b>Trapezoid</b></button>
      <button data-shape="circle"><i class="shape circle"></i><b>Circle</b></button>
      <button data-shape="wedge"><i class="shape wedge"></i><b>Wedge</b></button>
      <button data-shape="panel"><i class="shape panel"></i><b>Panel</b></button>
    </div>
    <div id="customShapePanel" hidden>
      <button class="primary wide" id="saveCustomShapeBtn">Save selected shape</button>
      <div id="customShapeGrid" class="shape-grid custom-shape-grid"></div>
    </div>
  </template>

  <template id="partsPanelTemplate">
    <div class="panel-form">
      <label>Part name<input id="partName" placeholder="Example: Porch Roof Beam #1" /></label>
      <label>Label<input id="partLabel" placeholder="Example: PRB 1" /></label>
      <div class="two-col"><label>Length<input id="partLength" type="number" min="0.01" step="0.125" value="8" /></label><label>Height<input id="partHeight" type="number" min="0.01" step="0.125" value="2" /></label></div>
      <div class="two-col"><label>Depth<input id="partDepth" type="number" min="0.01" step="0.125" value="2" /></label><label>Units<select id="partUnits"><option value="ft">feet</option><option value="in">inches</option></select></label></div>
      <div class="two-col"><label>Layer<input id="partLayer" value="Front Wall" /></label><label>Material<input id="partMaterial" value="Wood" /></label></div>
      <label>Color<button type="button" class="color-picker-trigger" id="partColorTrigger"><i style="background:#8b6b45"></i><span>#8B6B45</span></button><input id="partColor" type="hidden" value="#8b6b45" /></label>
      <label>Notes<textarea id="partNotes" rows="2"></textarea></label>
      <button class="primary wide" id="addPartBtn">Add 3D Part</button>
    </div>
  </template>

  <template id="labelsPanelTemplate">
    <div class="panel-form">
      <label>Selected part name<input id="editName" /></label>
      <label>Selected part label<input id="editLabel" /></label>
      <label>Notes<textarea id="editNotes" rows="3"></textarea></label>
      <button class="primary wide" id="applyLabelBtn">Apply to selection</button>
    </div>
  </template>

  <template id="layersPanelTemplate"><div id="layerPanelList" class="layer-panel-list"></div><button id="addLayerBtn" class="wide">+ Add layer</button></template>

  <template id="materialsPanelTemplate">
    <div class="material-grid">
      <button data-material="Wood" data-color="#8b6b45"><i style="background:#8b6b45"></i>Wood</button>
      <button data-material="Aged wood" data-color="#57473a"><i style="background:#57473a"></i>Aged wood</button>
      <button data-material="Metal" data-color="#87929c"><i style="background:#87929c"></i>Metal</button>
      <button data-material="Concrete" data-color="#a5a5a5"><i style="background:#a5a5a5"></i>Concrete</button>
      <button data-material="Roofing" data-color="#56606a"><i style="background:#56606a"></i>Roofing</button>
    </div>
    <label class="custom-color">Custom color<button type="button" class="color-picker-trigger" id="customMaterialColorTrigger"><i style="background:#8b6b45"></i><span>#8B6B45</span></button><input id="customMaterialColor" type="hidden" value="#8b6b45" /></label>
  </template>

  <template id="settingsPanelTemplate">
    <div class="action-grid">
      <button id="duplicateBtn">Duplicate</button><button id="deleteBtn">Delete</button>
      <button id="groupBtn">Fasten / Group</button><button id="ungroupBtn">Ungroup</button>
      <button id="uniteBtn">Unite</button><button id="subtractBtn">Subtract</button>
      <button id="intersectBtn">Intersect</button><button id="excludeBtn">Exclude</button>
      <button id="lockBtn">Lock</button><button id="hideBtn">Hide</button>
    </div>
    <hr />
    <div class="two-col"><label>Snap<input id="snapToggle" type="checkbox" checked /></label><label>Grid size<input id="gridSize" type="number" value="0.5" min="0.125" step="0.125" /></label></div>
    <button id="clearProjectBtn" class="danger wide">Clear project</button>
  </template>

  <template id="measurePanelTemplate">
    <div class="panel-form"><p class="hint">Tap two points on the canvas to measure. Measurements use the current project unit.</p><button id="measureModeBtn" class="primary wide">Start measurement</button><div id="measureResult" class="measure-result">No measurement yet.</div></div>
  </template>


  <div id="colorPickerBackdrop" class="color-picker-backdrop" hidden></div>
  <section id="colorPickerDialog" class="color-picker-dialog" hidden aria-modal="true" role="dialog" aria-labelledby="colorPickerTitle">
    <div class="color-picker-head"><h2 id="colorPickerTitle">Select color</h2><button id="closeColorPicker" aria-label="Close">×</button></div>
    <div id="svPicker" class="sv-picker"><span id="svCursor"></span></div>
    <input id="hueSlider" class="hue-slider" type="range" min="0" max="360" value="30" />
    <input id="alphaSlider" class="alpha-slider" type="range" min="0" max="100" value="100" />
    <div class="color-values">
      <label>Hex<input id="hexColor" maxlength="8" /></label>
      <label>R<input id="redColor" type="number" min="0" max="255" /></label>
      <label>G<input id="greenColor" type="number" min="0" max="255" /></label>
      <label>B<input id="blueColor" type="number" min="0" max="255" /></label>
      <label>A<input id="alphaColor" type="number" min="0" max="100" value="100" /></label>
      <i id="chosenColor"></i>
    </div>
    <div id="colorSwatches" class="color-swatches"></div>
    <div class="color-picker-actions"><button id="cancelColorPicker">Cancel</button><button class="primary" id="setColorPicker">Set</button></div>
  </section>
  <script type="module" src="app.js"></script>
</body>
</html>
